<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SAND Vault">
  <!--
    SAND Vault: three bricks, each with its studs showing, about to click
    together. A file goes into the vault as three encrypted parts on three
    separate accounts; any two of them rebuild it, which is why the bottom
    brick is dimmed. Family rules are in brand/README.md.
  -->
  <rect width="64" height="64" rx="14" fill="#0a0e17"/>
  <rect x="8.5" y="8.5" width="47" height="47" rx="9" fill="none" stroke="#1e2d3d" stroke-width="3"/>
  <g fill="#f59e0b">
    <rect x="17.5" y="14" width="5" height="4" rx="1"/>
    <rect x="25.5" y="14" width="5" height="4" rx="1"/>
    <rect x="33.5" y="14" width="5" height="4" rx="1"/>
    <rect x="41.5" y="14" width="5" height="4" rx="1"/>
    <rect x="17.5" y="26.5" width="5" height="4" rx="1"/>
    <rect x="25.5" y="26.5" width="5" height="4" rx="1"/>
    <rect x="33.5" y="26.5" width="5" height="4" rx="1"/>
    <rect x="41.5" y="26.5" width="5" height="4" rx="1"/>
  </g>
  <g fill="#d97706">
    <rect x="16" y="17" width="32" height="8" rx="2"/>
    <rect x="16" y="29.5" width="32" height="8" rx="2"/>
    <rect x="17.5" y="39" width="5" height="4" rx="1"/>
    <rect x="25.5" y="39" width="5" height="4" rx="1"/>
    <rect x="33.5" y="39" width="5" height="4" rx="1"/>
    <rect x="41.5" y="39" width="5" height="4" rx="1"/>
  </g>
  <rect x="16" y="42" width="32" height="8" rx="2" fill="#92400e"/>
</svg>
